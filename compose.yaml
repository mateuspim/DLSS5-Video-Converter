services:
  converter:
    build: .
    environment:
      DLSS5_BACKEND: software
      DLSS5_MAX_UPLOAD_BYTES: ${DLSS5_MAX_UPLOAD_BYTES:-21474836480}
    ports:
      - "127.0.0.1:${DLSS5_PORT:-7860}:7860"
    volumes:
      - ./data/outputs:/app/outputs
      - ./data/originals:/app/originals
      - ./data/work:/app/_work
      - ./data/jobs:/app/jobs
    restart: unless-stopped

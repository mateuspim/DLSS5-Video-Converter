name: Docker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dlss5-video-converter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests
        run: docker run --rm dlss5-video-converter:test python -m unittest discover -s tests -v

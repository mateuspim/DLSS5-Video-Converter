name: Docker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dlss5-video-converter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests
        run: docker run --rm dlss5-video-converter:test python -m unittest discover -s tests -v
      - name: Cross-build Windows worker
        run: ./scripts/build-windows-worker.sh
      - name: Inspect Windows worker
        run: |
          file bin/runtime/nvngx.dll
          test "$(od -An -tx1 -N2 bin/runtime/nvngx.dll | tr -d ' ')" = "4d5a"
      - name: Upload Windows worker
        uses: actions/upload-artifact@v7
        with:
          name: nvngx-windows-worker
          path: bin/runtime/nvngx.dll
          if-no-files-found: error
